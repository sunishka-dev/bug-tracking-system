{% extends "base.html" %}{% block body %}<p><a href="{{url_for('index')}}">← Back to dashboard</a></p><h1>Report a bug</h1><form class="panel" method="post"><label>Bug title<input name="title" required maxlength="100"></label><label>Description<textarea name="description" required rows="4"></textarea></label><div class="grid"><label>Priority<select name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></label><label>Reporter<input name="reporter" required></label></div><button class="btn">Save</button></form>{% endblock %}
