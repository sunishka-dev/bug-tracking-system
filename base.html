<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bug Tracking System</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a href="{{ url_for('index') }}" class="brand">Bug Tracking System</a><a class="btn" href="{{ url_for('add') }}">+ Add new</a></header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<p class="notice {{ c }}">{{ m }}</p>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main><footer>Built with Python, Flask and SQLite</footer></body></html>
